<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>AI Code Usage</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #16161a;
      --surface: #1e1e23;
      --text: #e8e6e3;
      --subtle: #9b9ba3;
      --muted: #77777f;
      --border: #2c2c33;
      --track: #303038;
      --accent: #d97757;
      --ok: #4caf6e;
      --warn: #d9a441;
      --danger: #e45858;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }
    .wrap { padding: 14px 16px; }
    h1 {
      display: flex;
      justify-content: space-between;
      margin: 0 0 2px;
      color: var(--subtle);
      font-size: 13px;
      font-weight: 600;
    }
    h1 .date { font-weight: 400; }
    .engine {
      border: 0;
      padding: 2px;
      border-radius: 3px;
      background: none;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }
    .engine.active { color: var(--text); }
    .engine:focus-visible, .session-button:focus-visible, .account-button:focus-visible, .account-code:focus-visible, .account-cancel:focus-visible { outline: 2px solid #80aaff; outline-offset: 2px; }
    .big { margin: 6px 0 0; color: var(--accent); font-size: 30px; font-weight: 700; }
    .sub { margin: 2px 0 14px; color: var(--subtle); }
    .limits { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: -4px 0 14px; }
    .limit { padding: 7px 8px; border-radius: 5px; background: var(--surface); }
    .limit.stale { opacity: .62; }
    .limit-head { display: flex; justify-content: space-between; color: #c9c7c4; }
    .limit-head strong { color: var(--text); }
    .bar { height: 4px; margin: 5px 0; overflow: hidden; border-radius: 2px; background: var(--track); }
    .bar i { display: block; height: 100%; background: var(--ok); }
    .bar i.warn { background: var(--warn); }
    .bar i.danger { background: var(--danger); }
    .reset { color: var(--muted); font-size: 10px; }
    .reset.warning { color: var(--warn); }
    .account {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px 10px;
      align-items: center;
      margin: -6px 0 12px;
      padding: 8px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    .account[hidden] { display: none; }
    .account-copy { min-width: 0; }
    .account-title { display: block; color: var(--text); font-size: 11px; }
    .account-detail { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .account-button {
      min-width: 62px;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid #b55e43;
      border-radius: 5px;
      background: var(--accent);
      color: #fff;
      font: 600 11px/1 'Segoe UI', system-ui, sans-serif;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, opacity 160ms ease;
    }
    .account-button:hover { border-color: #e49073; background: #e18263; }
    .account-button.disconnect { border-color: #4a4a54; background: #292930; color: #d4d2cf; }
    .account-button.disconnect:hover { border-color: #666670; background: #32323a; }
    .account-button:disabled { cursor: wait; opacity: .58; }
    .account-code-row {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 5px 6px;
      margin-top: 3px;
    }
    .account-code-row[hidden] { display: none; }
    .account-code-label { grid-column: 1 / -1; color: var(--subtle); font-size: 10px; }
    .account-code {
      min-width: 0;
      height: 32px;
      padding: 0 8px;
      border: 1px solid #4a4a54;
      border-radius: 5px;
      background: var(--bg);
      color: var(--text);
      font: 11px/1 'Segoe UI', system-ui, sans-serif;
      user-select: text;
    }
    .account-code::placeholder { color: #686870; }
    .account-cancel {
      height: 32px;
      padding: 0 9px;
      border: 1px solid #4a4a54;
      border-radius: 5px;
      background: #292930;
      color: #d4d2cf;
      font: 600 11px/1 'Segoe UI', system-ui, sans-serif;
      cursor: pointer;
    }
    .account-cancel:hover { border-color: #666670; background: #32323a; }
    .account-code:disabled, .account-cancel:disabled { cursor: wait; opacity: .58; }
    .account-message { min-height: 0; grid-column: 1 / -1; color: var(--ok); font-size: 10px; }
    .account-message.error { color: var(--danger); }
    table { width: 100%; margin-bottom: 14px; border-collapse: collapse; }
    th, td {
      padding: 4px 2px;
      border-bottom: 1px solid #26262c;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    th { color: var(--muted); font-size: 11px; font-weight: 500; }
    th:first-child, td:first-child {
      max-width: 120px;
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .unavailable { color: var(--warn); font-size: 10px; }
    h2 { margin: 0 0 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .session {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 8px;
      padding: 5px 3px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #c9c7c4;
      font: inherit;
      text-align: left;
    }
    .session-button { cursor: pointer; transition: background-color 160ms ease, color 160ms ease; }
    .session-button:hover { background: #24242a; color: var(--text); }
    .session-button:active { background: #2b2b32; }
    .session-button:disabled { cursor: wait; opacity: .6; }
    .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: #3a3a42; }
    .dot.working { background: var(--ok); }
    .dot.waiting { background: var(--warn); }
    .dot.attention { background: var(--danger); }
    .session .name { min-width: 0; overflow: hidden; flex: 1; text-overflow: ellipsis; white-space: nowrap; }
    .session .ago { flex: none; color: var(--muted); font-size: 11px; }
    .client { margin-left: 4px; color: #73737d; font-size: 10px; }
    .open-icon { width: 12px; height: 12px; flex: none; stroke: var(--muted); }
    .session-error { min-height: 0; padding: 0 3px 2px 19px; color: var(--danger); font-size: 10px; }
    .empty { padding: 12px 0; color: var(--muted); }
    .feedback { min-height: 18px; margin-top: 4px; color: var(--ok); font-size: 11px; }
    .note { margin-top: 8px; color: #66666e; font-size: 10px; }
    .note .warning { color: var(--warn); }
    @media (prefers-reduced-motion: reduce) { .session-button, .account-button { transition: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>
      <span><button class="engine active" data-engine="claude" aria-pressed="true">Claude</button> / <button class="engine" data-engine="codex" aria-pressed="false">Codex</button></span>
      <span class="date" id="date"></span>
    </h1>
    <div class="big" id="cost">—</div>
    <div class="sub" id="totals">—</div>
    <div class="limits" id="limits" hidden></div>
    <section class="account" id="claude-account" hidden aria-label="Claude 账户连接">
      <div class="account-copy"><strong class="account-title" id="account-title"></strong><span class="account-detail" id="account-detail"></span></div>
      <button type="button" class="account-button" id="account-button"></button>
      <div class="account-code-row" id="account-code-row" hidden>
        <label class="account-code-label" for="account-code">浏览器显示的授权码</label>
        <input class="account-code" id="account-code" type="text" autocomplete="off" spellcheck="false" placeholder="粘贴授权码" />
        <button type="button" class="account-cancel" id="account-cancel">取消</button>
      </div>
      <div class="account-message" id="account-message" role="status" aria-live="polite"></div>
    </section>

    <table id="models" hidden>
      <thead><tr id="model-head"><th>模型</th><th>请求</th><th>In</th><th>Out</th><th>Cache读</th><th>$</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="empty" hidden>今天还没有用量记录。</div>

    <h2>最近 24h 会话</h2>
    <div id="sessions"></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <p class="note" id="note"></p>
  </div>

  <script>
    const fmt = (n) =>
      n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
    const shortModel = (model) => model.replace(/^claude-/, '').replace(/-\d{8}$/, '');
    const stateLabel = { working: '工作中', waiting: '等你', attention: '需处理', idle: '空闲' };
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const windowLabel = (minutes) =>
      minutes % 1440 === 0 ? minutes / 1440 + 'd' : minutes % 60 === 0 ? minutes / 60 + 'h' : minutes + 'm';
    let selected = 'claude';
    let latest = null;
    let visibleSessions = [];
    let claudeAuth = { connected: false, connecting: false, awaitingCode: false, error: null };
    let authBusy = false;
    let authFeedback = '';
    let authFeedbackError = false;

    function render() {
      if (!latest) return;
      const usage = latest[selected];
      const isClaude = selected === 'claude';
      const unknown = new Set(usage.unknownModels || []);
      document.getElementById('date').textContent = usage.date;
      document.getElementById('cost').textContent = '≈$' + usage.costUSD.toFixed(2) + (unknown.size ? '+' : '');
      document.getElementById('totals').textContent =
        `in ${fmt(usage.totals.input)} · out ${fmt(usage.totals.output)} · cache读 ${fmt(usage.totals.cacheRead)} · ${isClaude ? 'cache写 ' + fmt(usage.totals.cacheWrite) : '推理 ' + fmt(usage.totals.reasoning)}`;

      const limits = isClaude
        ? [['5h', usage.rateLimits && usage.rateLimits.fiveHour], ['7d', usage.rateLimits && usage.rateLimits.sevenDay]].filter(([, value]) => value)
        : ((usage.rateLimits && usage.rateLimits.windows) || []).map((value) => [windowLabel(value.windowMinutes), value]);
      const limitsEl = document.getElementById('limits');
      limitsEl.hidden = limits.length === 0;
      limitsEl.innerHTML = limits.map(([label, value]) => {
        const pct = Math.round(value.usedPercentage);
        const level = pct >= 95 ? 'danger' : pct >= 80 ? 'warn' : '';
        const reset = value.resetsAt
          ? `${value.resetEstimated ? '≈ ' : ''}${new Date(value.resetsAt * 1000).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} 重置`
          : '';
        const stale = Boolean(usage.rateLimits && usage.rateLimits.stale);
        const detail = [stale ? '数据已过期' : '', reset].filter(Boolean).join(' · ');
        return `<div class="limit ${stale ? 'stale' : ''}">
          <div class="limit-head"><strong>${label}</strong><span>${pct}% 已用</span></div>
          <div class="bar"><i class="${level}" style="width:${Math.min(100, Math.max(0, pct))}%"></i></div>
          ${detail ? `<div class="reset ${stale ? 'warning' : ''}">${detail}</div>` : ''}
        </div>`;
      }).join('');

      if (usage.auth) claudeAuth = usage.auth;
      const account = document.getElementById('claude-account');
      account.hidden = !isClaude;
      if (isClaude) {
        const connected = Boolean(claudeAuth.connected);
        const awaitingCode = !connected && Boolean(claudeAuth.awaitingCode);
        document.getElementById('account-title').textContent = connected
          ? 'Claude 账户已连接'
          : awaitingCode ? '完成 Claude 连接' : '连接 Claude 账户';
        document.getElementById('account-detail').textContent = connected
          ? claudeAuth.error || '官方额度会提供准确的 5h / 7d 重置时间'
          : awaitingCode
            ? '授权后，把浏览器页面显示的登录码粘贴到下面'
            : '浏览器授权；凭证仅由 Windows 加密保存在本机';
        const accountButton = document.getElementById('account-button');
        accountButton.textContent = authBusy
          ? connected ? '断开中…' : awaitingCode ? '验证中…' : '打开中…'
          : connected ? '断开' : awaitingCode ? '验证' : '连接';
        accountButton.classList.toggle('disconnect', connected);
        accountButton.disabled = authBusy;
        accountButton.setAttribute('aria-busy', String(authBusy));
        const codeRow = document.getElementById('account-code-row');
        codeRow.hidden = !awaitingCode;
        document.getElementById('account-code').disabled = authBusy;
        document.getElementById('account-cancel').disabled = authBusy;
        const accountMessage = document.getElementById('account-message');
        accountMessage.textContent = authFeedback;
        accountMessage.classList.toggle('error', authFeedbackError);
        accountMessage.setAttribute('role', authFeedbackError ? 'alert' : 'status');
      }

      const models = Object.entries(usage.byModel).sort((a, b) => b[1].costUSD - a[1].costUSD);
      const table = document.getElementById('models');
      const empty = document.getElementById('empty');
      table.hidden = models.length === 0;
      empty.hidden = models.length !== 0;
      empty.textContent = '今天还没有 ' + (isClaude ? 'Claude' : 'Codex') + ' 用量记录。';
      document.getElementById('model-head').innerHTML = isClaude
        ? '<th>模型</th><th>请求</th><th>In</th><th>Out</th><th>Cache读</th><th>$</th>'
        : '<th>模型</th><th>轮次</th><th>In</th><th>Out</th><th>Cache读</th><th>$</th>';
      table.querySelector('tbody').innerHTML = models.map(([model, bucket]) => `<tr>
        <td title="${esc(model)}">${esc(shortModel(model))}</td><td>${bucket.requests}</td>
        <td>${fmt(bucket.input)}</td><td>${fmt(bucket.output)}</td><td>${fmt(bucket.cacheRead)}</td>
        <td>${unknown.has(model) ? '<span class="unavailable" title="价格不可用">不可用</span>' : bucket.costUSD.toFixed(2)}</td>
      </tr>`).join('');

      visibleSessions = usage.sessions.slice(0, isClaude ? (claudeAuth.awaitingCode ? 3 : 5) : limits.length ? 6 : 8);
      document.getElementById('sessions').innerHTML = visibleSessions.map((session, index) => {
        const mins = Math.max(0, Math.round((Date.now() - session.mtime) / 60000));
        const ago = mins < 60 ? `${mins}m` : `${Math.round(mins / 60)}h`;
        const state = stateLabel[session.state] ? session.state : 'idle';
        const title = [session.cwd, session.client, session.message].filter(Boolean).join('\n');
        const label = session.title || session.project;
        const content = `<span class="dot ${state}"></span>
          <span class="name" title="${esc(title)}">${esc(label)}<span class="client">${esc(session.client || '')}</span></span>
          <span class="ago">${stateLabel[state]} · ${ago} 前</span>`;
        return session.client === 'Desktop'
          ? `<div><button type="button" class="session session-button" data-session-index="${index}" aria-label="在 ${isClaude ? 'Claude' : 'Codex'} Desktop 打开 ${esc(label)}">${content}
              <svg class="open-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3h7v7M13 3 5 11M11 9v4H3V5h4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button><div class="session-error" id="session-error-${index}" role="alert"></div></div>`
          : `<div class="session">${content}</div>`;
      }).join('') || '<div class="empty">最近 24 小时没有会话。</div>';

      const provider = isClaude ? 'Anthropic' : 'OpenAI';
      const warnings = [
        unknown.size ? `${unknown.size} 个模型价格不可用，合计金额不完整` : '',
        usage.dataStatus?.state !== 'ok' ? usage.dataStatus.message : '',
        usage.rateLimits?.stale ? '额度数据已超过 15 分钟未更新' : '',
        isClaude && usage.rateLimits?.source === 'desktop' ? '≈ 重置时间由 Claude Desktop 本地采样推算，约有 5 分钟误差' : '',
      ].filter(Boolean);
      document.getElementById('note').innerHTML =
        `${provider} 标准 API 等价值（订阅用户不会按此金额计费）· 价格快照 ${esc(usage.priceSnapshot || '未知')} · 每 30 秒刷新。` +
        (warnings.length ? `<br><span class="warning">${esc(warnings.join('；'))}</span>` : '');
    }

    async function load() {
      try {
        [latest, claudeAuth] = await Promise.all([window.api.getUsage(), window.api.getClaudeAuth()]);
        render();
      } catch {
        document.getElementById('note').textContent = '暂时无法读取本地用量数据。';
      }
    }

    document.querySelectorAll('.engine').forEach((button) => {
      button.addEventListener('click', () => {
        selected = button.dataset.engine;
        document.querySelectorAll('.engine').forEach((item) => {
          const active = item === button;
          item.classList.toggle('active', active);
          item.setAttribute('aria-pressed', String(active));
        });
        document.getElementById('feedback').textContent = '';
        render();
      });
    });

    document.getElementById('sessions').addEventListener('click', async (event) => {
      const button = event.target.closest('.session-button');
      if (!button) return;
      const index = Number(button.dataset.sessionIndex);
      const session = visibleSessions[index];
      const errorEl = document.getElementById(`session-error-${index}`);
      if (!session || session.client !== 'Desktop') return;
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      errorEl.textContent = '';
      document.getElementById('feedback').textContent = '';
      try {
        await window.api.openSession({
          provider: selected,
          client: session.client,
          sessionId: session.sessionId,
        });
      } catch (error) {
        errorEl.textContent = String(error.message || '打开失败').replace(/^.*Error: /, '');
      } finally {
        button.disabled = false;
        button.removeAttribute('aria-busy');
      }
    });

    document.getElementById('account-button').addEventListener('click', async () => {
      if (authBusy) return;
      const disconnecting = Boolean(claudeAuth.connected);
      const completing = !disconnecting && Boolean(claudeAuth.awaitingCode);
      const codeInput = document.getElementById('account-code');
      const code = codeInput.value.trim();
      if (completing && !code) {
        authFeedback = '请先粘贴浏览器显示的 Claude 授权码。';
        authFeedbackError = true;
        render();
        codeInput.focus();
        return;
      }
      authBusy = true;
      authFeedbackError = false;
      authFeedback = disconnecting
        ? '正在删除本机登录信息…'
        : completing ? '正在验证 Claude 授权码…' : '正在打开 Claude 授权页面…';
      render();
      try {
        claudeAuth = disconnecting
          ? await window.api.disconnectClaude()
          : completing ? await window.api.completeClaude(code) : await window.api.connectClaude();
        if (latest && latest.claude) latest.claude.auth = claudeAuth;
        if (disconnecting || completing) latest = await window.api.getUsage();
        authFeedback = disconnecting
          ? '已断开 Claude 账户。'
          : completing ? '连接成功，重置时间会自动刷新。' : '授权后复制浏览器显示的登录码，再回到这里粘贴。';
        if (completing) codeInput.value = '';
      } catch (error) {
        authFeedback = String(error.message || 'Claude 账户操作失败').replace(/^.*Error: /, '');
        authFeedbackError = true;
        try {
          claudeAuth = await window.api.getClaudeAuth();
          if (latest && latest.claude) latest.claude.auth = claudeAuth;
        } catch {}
      } finally {
        authBusy = false;
        render();
      }
    });

    document.getElementById('account-cancel').addEventListener('click', async () => {
      if (authBusy) return;
      authBusy = true;
      authFeedback = '';
      authFeedbackError = false;
      render();
      try {
        claudeAuth = await window.api.cancelClaude();
        if (latest && latest.claude) latest.claude.auth = claudeAuth;
        document.getElementById('account-code').value = '';
      } catch (error) {
        authFeedback = String(error.message || '取消 Claude 授权失败').replace(/^.*Error: /, '');
        authFeedbackError = true;
      } finally {
        authBusy = false;
        render();
      }
    });

    document.getElementById('account-code').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') document.getElementById('account-button').click();
    });

    window.api.onUsage((usage) => { latest = usage; render(); });
    load();
  </script>
</body>
</html>
