<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>AI Code Usage</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111116;
      --surface: #19191f;
      --muted: #8f8f99;
      --text: #f2f0ed;
      --border: #34343d;
      --track: #303038;
      --claude: #d97757;
      --ok: #4caf6e;
      --warn: #d9a441;
      --danger: #e45858;
    }
    /* 流光环:动画挂在 body 上、--sweep 声明为 inherits,环只是读它。
       这样 render() 每 30 秒整块重写 innerHTML 时环不会重新开始转,
       多家同时在跑也天然同步。没人在跑时 body 不带 busy-any,动画完全停。 */
    @property --sweep { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
    @keyframes ring-sweep { to { --sweep: 360deg; } }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--text);
      font: 12px/1.35 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }
    #surface {
      position: absolute;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: color-mix(in srgb, var(--bg) 96%, transparent);
      box-shadow: 0 8px 24px #0008;
      will-change: clip-path;
      transition: clip-path 280ms cubic-bezier(.4, 0, 1, 1), border-color 180ms ease, background-color 180ms ease;
    }
    #surface::after {
      content: '';
      position: absolute;
      z-index: 3;
      pointer-events: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      opacity: 1;
      transition: opacity 120ms ease-in;
    }
    #surface:hover { border-color: #4a4a55; background: #15151a; }
    #surface:hover::after { border-color: #4a4a55; }
    .compact {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 5px 12px;
      opacity: 1;
      visibility: visible;
      transition: opacity 140ms ease-out 90ms, transform 220ms ease-out, visibility 0s;
    }
    .compact-provider { position: relative; min-width: 0; display: flex; align-items: center; gap: 7px; }
    .compact-provider + .compact-provider { padding-left: 14px; border-left: 1px solid #303038; }
    .brand { width: 20px; height: 20px; flex: none; fill: currentColor; }
    .brand.claude { color: var(--claude); }
    .brand.openai { color: #f2f0ed; }
    .brand.grok { color: #f2f0ed; }
    .metrics { display: flex; align-items: baseline; gap: 7px; font-variant-numeric: tabular-nums; }
    .metric { color: #d4d2cf; white-space: nowrap; }
    .metric b { margin-right: 2px; color: var(--muted); font-size: 10px; font-weight: 600; }
    .dash { color: var(--muted); }
    .warning { color: var(--warn); font-weight: 700; }
    .stale { opacity: .62; }
    body.busy-any { animation: ring-sweep 2.4s linear infinite; }
    body.ring-off { animation: none; }
    [data-provider='claude'] { --ring: var(--claude); }
    [data-provider='codex'] { --ring: #9fe8c3; }
    [data-provider='grok'] { --ring: #8fb7ff; }
    .busy.attention { --ring: var(--warn); }
    .busy::before {
      content: '';
      position: absolute;
      padding: 1.4px;
      pointer-events: none;
      background: conic-gradient(from var(--sweep), transparent 0 58%, color-mix(in srgb, var(--ring) 55%, transparent) 72%, #fff2 80%, var(--ring) 88%, transparent 96% 100%);
      /* 中间挖空只剩一圈边 */
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }
    .busy::after {
      content: '';
      position: absolute;
      pointer-events: none;
      border: 1px solid color-mix(in srgb, var(--ring) 26%, transparent);
      box-shadow: 0 0 10px -2px color-mix(in srgb, var(--ring) 70%, transparent), inset 0 0 8px -5px var(--ring);
    }
    /* 收起态挤在 38px 高的条里:外扩 3px 正好落在 padding 的空隙上,不会被 clip-path 切掉 */
    .compact-provider.busy::before, .compact-provider.busy::after { inset: -3px -5px; border-radius: 9px; }
    .provider.busy::before, .provider.busy::after { inset: -2px; border-radius: 10px; }
    /* 竖排时收起态只有 54px 宽,左右各 5px padding:横向只能外扩 1px */
    body.position-right .compact-provider.busy::before,
    body.position-right .compact-provider.busy::after { inset: -4px -1px; }
    body.ring-rainbow .busy:not(.attention)::before {
      background: conic-gradient(from var(--sweep), transparent 0 50%, #ff8a4c 62%, #ffd166 70%, #7ee0a8 78%, #6aa9ff 86%, transparent 94% 100%);
    }
    body.ring-rainbow .busy:not(.attention)::after {
      border-color: #ffffff1f;
      box-shadow: 0 0 10px -3px #ff8a4c99;
    }
    body.ring-off .busy::before, body.ring-off .busy::after { display: none; }
    .details {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: grid;
      padding: 8px;
      gap: 8px;
      grid-template-columns: repeat(var(--n), 1fr);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px) scale(.985);
      transition: opacity 140ms ease-in, transform 200ms ease-in, visibility 0s linear 200ms;
    }
    body.expanded #surface::after { opacity: 0; }
    body.expanded .compact {
      opacity: 0;
      visibility: hidden;
      transform: scale(.98);
      transition: opacity 140ms ease-in 140ms, transform 240ms ease-in, visibility 0s linear 280ms;
    }
    body.expanded .details {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity 220ms ease-out 120ms, transform 280ms cubic-bezier(.23, 1, .32, 1) 100ms, visibility 0s;
    }
    .provider {
      position: relative;
      min-width: 0;
      padding: 10px;
      border: 1px solid #2b2b33;
      border-radius: 8px;
      background: var(--surface);
    }
    .provider-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
    .provider-head .brand { width: 18px; height: 18px; }
    .provider-name { font-weight: 650; }
    .cost { margin-left: auto; color: #f0a07f; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .cost small { color: var(--muted); font-size: 9px; font-weight: 500; }
    .quota { margin-top: 6px; }
    .quota-head { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
    .quota-head strong { font-size: 11px; }
    .quota-head span { color: #d4d2cf; }
    .bar { height: 4px; margin: 4px 0; overflow: hidden; border-radius: 4px; background: var(--track); }
    .bar i { display: block; height: 100%; background: var(--ok); }
    .bar i.warn { background: var(--warn); }
    .bar i.danger { background: var(--danger); }
    .reset, .provider-status { color: var(--muted); font-size: 10px; }
    .provider-status { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
    .provider-status.bad { color: var(--warn); }
    .provider-status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }
    .provider-status.bad::before { background: var(--warn); }
    .empty-quota { padding: 18px 0 12px; color: var(--muted); text-align: center; }
    .token-fallback { padding: 12px 0 8px; text-align: center; font-variant-numeric: tabular-nums; }
    .token-total { color: #d4d2cf; font-size: 13px; font-weight: 700; }
    .token-total small { margin-right: 4px; color: var(--muted); font-size: 10px; font-weight: 600; }
    .token-breakdown { margin-top: 3px; color: var(--muted); font-size: 10px; }
    /* 尺寸由 layout() 量出来写进变量:--cw/--ch 是收起条,--sw/--sh 是展开后的整面。
       两种状态下面一样大,窗口收起时只有收起条那么大,clip-path 只露出这一块;
       展开时窗口先长到整面,clip-path 再放开。默认值是原来三家时的尺寸。 */
    :root { --n: 3; --cw: 440px; --ch: 38px; --sw: 648px; --sh: 220px; }
    #surface { width: var(--sw); height: var(--sh); }
    body.position-top #surface { top: 2px; left: 50%; transform: translateX(-50%);
      clip-path: inset(0 calc((var(--sw) - var(--cw)) / 2) calc(var(--sh) - var(--ch)) calc((var(--sw) - var(--cw)) / 2) round 12px); }
    body.position-top #surface::after, body.position-top .compact { top: 0; left: calc((var(--sw) - var(--cw)) / 2); height: 38px; }
    body.position-top #surface::after { width: var(--cw); }
    body.position-top .compact { width: max-content; }
    body.position-right #surface { top: 50%; right: 2px; transform: translateY(-50%);
      clip-path: inset(calc((var(--sh) - var(--ch)) / 2) 0 calc((var(--sh) - var(--ch)) / 2) calc(var(--sw) - 54px) round 12px); }
    body.position-right #surface::after, body.position-right .compact { top: calc((var(--sh) - var(--ch)) / 2); left: calc(var(--sw) - 54px); width: 54px; }
    body.position-right #surface::after { height: var(--ch); }
    body.position-right .compact { height: max-content; flex-direction: column; gap: 14px; padding: 10px 5px; }
    body.expanded.position-top #surface,
    body.expanded.position-right #surface { clip-path: inset(0 round 12px); transition: clip-path 400ms cubic-bezier(.23, 1, .32, 1), border-color 180ms ease, background-color 180ms ease; }
    /* 屏幕放不下时展开面封顶,卡片区滚动(比如右侧五家全开约 630px,1366×768 开 125% 缩放只有约 574px 可用) */
    .details.scroll { height: 100%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #4a4a55 transparent; }
    body.position-right .compact-provider { width: 100%; flex-direction: column; gap: 5px; }
    body.position-right .compact-provider + .compact-provider { padding: 14px 0 0; border-top: 1px solid #303038; border-left: 0; }
    body.position-right .metrics { flex-direction: column; gap: 2px; align-items: center; }
    body.position-right .metric { font-size: 10px; }
    body.position-right .metric b { display: block; margin: 0; text-align: center; font-size: 8px; }
    body.position-right .details { grid-template-columns: 1fr; }
    body.position-right .provider { padding: 8px 10px; }
    body.position-right .provider-head { margin-bottom: 3px; }
    body.position-right .quota { margin-top: 3px; }
    body.position-right .provider-status { margin-top: 5px; }
    @media (prefers-reduced-motion: reduce) {
      #surface, #surface::after, .compact, .details, body.expanded #surface, body.expanded .compact, body.expanded .details { transition: none; }
      /* 不转、也不呼吸:留一圈静态的光,状态照样看得见 */
      body.busy-any { animation: none; }
      .busy::before { background: color-mix(in srgb, var(--ring) 55%, transparent); }
      body.ring-rainbow .busy:not(.attention)::before { background: linear-gradient(90deg, #ff8a4c, #ffd166, #7ee0a8, #6aa9ff); }
    }
  </style>
</head>
<body class="position-top">
  <main id="surface" role="button" aria-label="打开 AI Code Usage 完整面板">
    <div class="compact" id="compact"></div>
    <div class="details" id="details"></div>
  </main>
  <script>
    // cacheSeparate: input 不含缓存的几家(口径见 lib/report.js 的 PROVIDERS),总量要把缓存加回来。
    // noQuota: 根本没有额度窗口的几家,没额度不算异常。
    const providerInfo = {
      claude: { name: 'Claude', logo: 'claude', logoClass: 'claude', costLabel: '等价值', cacheSeparate: true },
      codex: { name: 'Codex', logo: 'openai', logoClass: 'openai', costLabel: '等价值' },
      grok: { name: 'Grok', logo: 'grok', logoClass: 'grok', costLabel: '金额' },
      // Antigravity 的标志只有位图:安装包 app.asar 里的 icon.png,去掉白色底板、裁到拱形、缩成 64px
      antigravity: { name: 'Antigravity', image: 'antigravity.png', costLabel: '等价值', cacheSeparate: true, noQuota: true },
      opencode: { name: 'OpenCode', logo: 'opencode', logoClass: 'opencode', costLabel: '记录金额', cacheSeparate: true, noQuota: true },
    };
    // 流光环只有这三家:activity.js 只看它们的会话目录
    const ringProviders = new Set(['claude', 'codex', 'grok']);
    let latest = null;
    let providers = ['claude', 'codex', 'grok'];
    let activity = {};
    let ringStyle = null;
    let previewTimer = null;
    let expanded = false;
    let expandTimer = null;
    let collapseTimer = null;
    let sentSize = '';

    const logo = (provider) => {
      const info = providerInfo[provider];
      return info.image
        ? `<img class="brand" src="${info.image}" alt="" aria-hidden="true">`
        : `<svg class="brand ${info.logoClass}" aria-hidden="true"><use href="provider-logos.svg#${info.logo}"></use></svg>`;
    };
    const windowsFor = (provider, usage) => {
      if (provider === 'codex' && ['api', 'apikey'].includes(usage.authMode)) return [];
      return provider === 'claude'
        ? [
            ['5h', usage.rateLimits && usage.rateLimits.fiveHour],
            ['7d', usage.rateLimits && usage.rateLimits.sevenDay],
            ['Fable', usage.rateLimits && usage.rateLimits.sevenDayFable],
          ].filter(([, value]) => value)
        : [
            ['5h', usage.rateLimits && usage.rateLimits.windows.find((value) => value.windowMinutes === 300)],
            ['7d', usage.rateLimits && usage.rateLimits.windows.find((value) => value.windowMinutes === 10080)],
          ].filter(([, value]) => value);
    };
    const isStale = (usage) =>
      usage.dataStatus?.state !== 'ok' || Boolean(usage.rateLimits && usage.rateLimits.stale);
    const tokenValue = (value) => Number.isFinite(value) ? Math.max(0, value) : 0;
    const formatTokens = (value) => {
      const n = tokenValue(value);
      return n >= 1e9 ? (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
    };
    const tokenUsage = (provider, usage) => {
      const totals = usage.totals || {};
      const input = tokenValue(totals.input) + (providerInfo[provider].cacheSeparate
        ? tokenValue(totals.cacheRead) + tokenValue(totals.cacheWrite)
        : 0);
      const output = tokenValue(totals.output);
      return { input, output, total: input + output };
    };
    const rangeLabel = (usage) => usage.rangeDays === 1 ? '今日' : `${usage.rangeDays || 1}天`;
    const statusText = (usage, provider) => {
      if (usage.dataStatus?.state !== 'ok') return usage.dataStatus.message || '本地数据读取失败';
      if (usage.rateLimits?.stale) return '额度数据已超过 15 分钟未更新';
      if (providerInfo[provider].noQuota) {
        return tokenUsage(provider, usage).total > 0 ? `没有额度窗口 · 显示${rangeLabel(usage)} Token` : `${rangeLabel(usage)}暂无用量`;
      }
      if (!windowsFor(provider, usage).length) {
        return tokenUsage(provider, usage).total > 0
          ? `未提供额度 · 显示${rangeLabel(usage)} Token`
          : '额度数据尚不可用';
      }
      if (provider === 'claude' && usage.appRunning && usage.costCoverage === 'unavailable') {
        const detected = usage.sessions.some((session) => session.source === 'desktop-cache');
        return detected ? '已识别 Home 聊天 · token/金额不可用' : 'Claude Desktop 已打开 · token 明细不可用';
      }
      if (provider === 'claude' && usage.appRunning) return 'Claude Desktop 已打开';
      const updatedAt = usage.rateLimits.updatedAt;
      if (!Number.isFinite(updatedAt)) return '额度数据正常';
      const minutes = Math.max(0, Math.round((Date.now() - updatedAt) / 60000));
      if (usage.rateLimits.source === 'desktop') return minutes < 1 ? 'Desktop 刚刚采样' : `Desktop ${minutes} 分钟前采样`;
      return minutes < 1 ? '刚刚更新' : `${minutes} 分钟前更新`;
    };
    const resetText = (value) => value.resetsAt
      ? `${value.resetEstimated ? '≈ ' : ''}${new Date(value.resetsAt * 1000).toLocaleString('zh-CN', {
          month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit',
        })} 重置`
      : '';
    const costText = (provider, usage) => {
      if (provider === 'claude' && usage.costCoverage === 'unavailable') return '—';
      // 和面板一致:有没定价的型号(比如 Antigravity 的 gemini-pro-default)就标 +
      const incomplete = (provider === 'claude' && usage.costCoverage === 'partial') || (usage.unknownModels || []).length > 0;
      return `≈$${usage.costUSD.toFixed(2)}${incomplete ? '+' : ''}`;
    };

    function render() {
      if (!latest) return;
      const shown = providers.filter((provider) => latest[provider]);
      document.getElementById('compact').innerHTML = shown
        .map((provider) => {
          const usage = latest[provider];
          const windows = windowsFor(provider, usage);
          const tokens = tokenUsage(provider, usage);
          return `<div class="compact-provider ${isStale(usage) ? 'stale' : ''}" data-provider="${provider}">
            ${logo(provider)}
            <div class="metrics">${windows.length
              ? windows.map(([label, value]) => `<span class="metric"><b>${label}</b>${Math.round(value.usedPercentage)}%</span>`).join('')
              : tokens.total > 0
                ? `<span class="metric"><b>${usage.rangeDays || 1}d</b>${formatTokens(tokens.total)}</span>`
                : '<span class="dash">—</span>'}</div>
            ${isStale(usage) ? '<span class="warning" title="数据可能已过期">!</span>' : ''}
          </div>`;
        })
        .join('');
      document.getElementById('details').innerHTML = shown
        .map((provider) => {
          const info = providerInfo[provider];
          const usage = latest[provider];
          const windows = windowsFor(provider, usage);
          const tokens = tokenUsage(provider, usage);
          const stale = isStale(usage);
          return `<section class="provider ${stale ? 'stale' : ''}" data-provider="${provider}">
            <div class="provider-head">${logo(provider)}<span class="provider-name">${info.name}</span>
              <span class="cost"><small>${rangeLabel(usage)}${info.costLabel}</small> ${costText(provider, usage)}</span></div>
            ${windows.length ? windows.map(([label, value]) => {
              const pct = Math.round(value.usedPercentage);
              const level = pct >= 95 ? 'danger' : pct >= 80 ? 'warn' : '';
              const reset = resetText(value);
              return `<div class="quota"><div class="quota-head"><strong>${label}</strong><span>${pct}% 已用</span></div>
                <div class="bar"><i class="${level}" style="width:${Math.min(100, Math.max(0, pct))}%"></i></div>
                ${reset ? `<div class="reset">${reset}</div>` : ''}</div>`;
            }).join('') : tokens.total > 0 || info.noQuota
              ? `<div class="token-fallback"><div class="token-total"><small>${rangeLabel(usage)} Token</small>${formatTokens(tokens.total)}</div><div class="token-breakdown">输入 ${formatTokens(tokens.input)} · 输出 ${formatTokens(tokens.output)}</div></div>`
              : '<div class="empty-quota">额度 —</div>'}
            <div class="provider-status ${stale || (!info.noQuota && !windows.length && tokens.total === 0) ? 'bad' : ''}" title="${usage.rateLimits?.source === 'desktop' ? 'Claude Desktop 每约 5 分钟采样；≈ 为本地推算时间' : ''}">${statusText(usage, provider)}${usage.rateLimits?.source === 'desktop' ? ' · 重置时间为本地推算' : ''}</div>
          </section>`;
        })
        .join('');
      applyActivity();
      layout();
    }

    // 按显示的家数和实际内容量出尺寸:收起条按内容,展开面顶部每家一列、右侧固定宽。
    // 屏幕放不下就封顶,卡片区改成滚动。量完把窗口尺寸报给主进程。
    // 面的宽高取偶数:translateX/Y(-50%) 落在半像素上字会发虚。
    const even = (value) => value + (value % 2);
    const evenCap = (value) => value - (value % 2); // 封顶也取偶,往下取才不会超出屏幕
    function layout() {
      if (!latest) return;
      const top = !document.body.classList.contains('position-right');
      const compact = document.getElementById('compact');
      const details = document.getElementById('details');
      const style = document.documentElement.style;
      const n = Math.max(1, compact.children.length);
      style.setProperty('--n', n);
      const cw = compact.offsetWidth;
      const ch = compact.offsetHeight;
      const sw = Math.min(even(top ? Math.max(cw, 16 + n * 206 + (n - 1) * 8) : 322), evenCap(screen.availWidth - 20));
      // 尺寸变了(启动、勾选、数字变宽)时直接跳到新尺寸:clip-path 的过渡是给悬停展开用的,
      // 让它追新尺寸的话条两端会被切掉一小会儿
      let jump = style.getPropertyValue('--sw') !== `${sw}px`;
      if (jump) surface.style.transition = 'none';
      style.setProperty('--sw', `${sw}px`);
      // 摘掉 scroll 才量得到卡片的自然高度,但滚动位置会被清零:先记下再写回
      const scrollTop = details.scrollTop;
      details.classList.remove('scroll');
      const dh = details.offsetHeight + 2; // 卡片区在面的边框以内,上下各 1px
      const sh = Math.min(even(Math.max(dh, ch)), evenCap(screen.availHeight - 20));
      details.classList.toggle('scroll', dh > sh);
      details.scrollTop = scrollTop;
      for (const [name, value] of [['--cw', `${cw}px`], ['--ch', `${ch}px`], ['--sh', `${sh}px`]]) {
        if (style.getPropertyValue(name) === value) continue;
        if (!jump) surface.style.transition = 'none';
        jump = true;
        style.setProperty(name, value);
      }
      if (jump) {
        void surface.offsetWidth;
        surface.style.transition = '';
      }
      const size = { position: top ? 'top' : 'right', collapsed: [cw + 4, ch + 4], expanded: [sw + 4, sh + 4] };
      const key = JSON.stringify(size);
      if (key !== sentSize) {
        sentSize = key;
        window.api.setFloatingSize(size);
      }
    }

    // 环的开关和快照分开走:快照 30 秒一次,活动状态由主进程 watch 到写入就推过来
    function applyActivity() {
      for (const element of document.querySelectorAll('[data-provider]')) {
        const state = activity[element.dataset.provider] || '';
        element.classList.toggle('busy', Boolean(state));
        element.classList.toggle('attention', state === 'attention');
      }
      document.body.classList.toggle('busy-any', Object.values(activity).some(Boolean));
    }

    // 换样式时多半没人在跑,环是灭的,看着像菜单没生效:先点亮两秒给个预览
    function previewRings() {
      clearTimeout(previewTimer);
      for (const element of document.querySelectorAll('[data-provider]')) {
        if (ringProviders.has(element.dataset.provider)) element.classList.add('busy');
      }
      document.body.classList.add('busy-any');
      previewTimer = setTimeout(applyActivity, 2000);
    }

    function applyState(state) {
      expanded = Boolean(state.expanded);
      document.body.classList.toggle('expanded', expanded);
      document.body.classList.toggle('position-top', state.position === 'top');
      document.body.classList.toggle('position-right', state.position === 'right');
      document.body.classList.toggle('ring-rainbow', state.ringStyle === 'rainbow');
      document.body.classList.toggle('ring-off', state.ringStyle === 'off');
      // 换了显示哪几家才重画;悬停展开、换位置、换屏只重新量,不重写内容(也不会掐掉环的预览)
      const next = Array.isArray(state.providers) ? state.providers : providers;
      const changed = next.join() !== providers.join();
      providers = next;
      if (changed) render();
      else layout();
      const style = state.ringStyle || 'brand';
      if (ringStyle !== null && style !== ringStyle) previewRings();
      ringStyle = style;
    }

    const surface = document.getElementById('surface');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    surface.addEventListener('mouseenter', () => {
      clearTimeout(collapseTimer);
      if (!expanded) expandTimer = setTimeout(() => window.api.setFloatingExpanded(true, reduceMotion.matches), 200);
    });
    surface.addEventListener('mouseleave', () => {
      clearTimeout(expandTimer);
      if (expanded) collapseTimer = setTimeout(() => window.api.setFloatingExpanded(false, reduceMotion.matches), 300);
    });
    // 点卡片区的滚动条不会触发 click(2026-10-04 实测:轨道点击翻页了,click 一次没来),不用另外拦
    surface.addEventListener('click', () => window.api.openPanel());
    window.api.onUsage((usage) => { latest = usage; render(); });
    window.api.getUsage().then((usage) => { latest = usage; render(); });
    window.api.getFloatingState().then(applyState);
    window.api.onFloatingState?.(applyState);
    window.api.onFloatingActivity?.((next) => { activity = next || {}; applyActivity(); });
  </script>
</body>
</html>
